min_version = "2026.8.0"

[tools]
go = "1.26.6"

[tasks.test]
description = "Run the complete Soro test suite"
run = "go test ./..."

[tasks.check]
description = "Run formatting, tests, race detector, and vet"
run = "test -z \"$(gofmt -l .)\" && go test ./... && go test -race ./... && go vet ./..."
