name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SORO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/soro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
