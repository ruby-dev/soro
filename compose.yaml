services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - soro-postgres:/var/lib/postgresql/data

volumes:
  soro-postgres:
